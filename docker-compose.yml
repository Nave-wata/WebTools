services:
  web:
    build:
      context: web/docker
      dockerfile: Dockerfile
    volumes:
      - ./web:/var/www/html
    ports:
      - "8080:8080"
    tty: true

  tailwind:
    image: node:20
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    stdin_open: true
    tty: true
    command: sh -c "npm install tailwindcss@4 @tailwindcss/cli@4 && npx -y tailwindcss -i ./input.css -o ./assets/tailwind.css --watch"
