
[package]
name = "WebTools"
version = "0.1.0"
authors = ["dioxus"]
edition = "2021"

[features]
default = ["development"]
production = []
development = ["dep:dioxus-logger", "dep:log"]

[dependencies]
dioxus = { version = "0.6.0", features = ["router", "web"] }
itertools = "0.14.0"
rand = { version = "0.7.3", features = ["wasm-bindgen"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.133"
url = "2.5.4"
wasm-bindgen-futures = "0.4.45"
web-sys = { version = "0.3.72", features = ["Navigator", "Clipboard", "Window"] }

# 開発環境でのみ使用する依存関係
dioxus-logger = { version = "0.6.0", optional = true }
log = { version = "0.4.22", optional = true }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
