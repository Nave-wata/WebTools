[package]
name = "WebTools"
version = "0.1.0"
authors = ["dioxus"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

dioxus = { version = "0.6.0", features = ["web", "router"] }
itertools = "0.14.0"
rand = { version = "0.7.3", features = ["wasm-bindgen"] }


# Debug
dioxus-logger = "0.6.0"
log = "0.4.22"


[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
