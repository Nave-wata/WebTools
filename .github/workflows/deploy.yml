name: Deploy Web App to S3 and Invalidate Cache

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.87.0
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./web -> target"
          cache-on-failure: true

      - name: Cache Dioxus CLI
        uses: actions/cache@v3
        id: cache-dioxus
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dioxus-cli-0.6.3

      - name: Install Dioxus CLI
        if: steps.cache-dioxus.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version 0.6.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build TailwindCSS
        working-directory: ./web
        run: npx tailwindcss -i ./input.css -o ./assets/tailwind.css

      - name: Build Web App
        working-directory: ./web
        run: dx bundle --platform web --ssg --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 and Track Changed Files
        id: deploy
        working-directory: ./web
        run: |
          echo "Deploying to S3 and tracking changes..."
          
          # 変更ファイルを保存するための一時ファイル
          CHANGE_LOG=$(mktemp)
          
          # S3同期を実行し、出力を一時ファイルに保存
          aws s3 sync ./dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete 2>&1 | tee $CHANGE_LOG
          
          # 変更されたファイルを抽出（アップロード、更新、削除）
          CHANGED_FILES=$(grep -E 'upload:|copy:|delete:' $CHANGE_LOG | grep -v 'Completed' | sed -E 's/^.*\/(dist\/|s3:\/\/[^\/]+\/)/\//' | sort -u)
          
          # 変更されたファイルが10個以下なら個別に無効化、それ以上なら全体を無効化
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed. No invalidation needed."
            echo "INVALIDATION_PATHS=NONE" >> $GITHUB_OUTPUT
          elif [ $(echo "$CHANGED_FILES" | wc -l) -le 10 ]; then
            # パスをCloudFrontフォーマットに変換
            PATHS=$(echo "$CHANGED_FILES" | tr '\n' ' ')
            echo "Changed files (specific invalidation): $PATHS"
            echo "INVALIDATION_PATHS=$PATHS" >> $GITHUB_OUTPUT
          else
            echo "Many files changed. Will invalidate entire distribution."
            echo "INVALIDATION_PATHS=/*" >> $GITHUB_OUTPUT
          fi
          
          # 一時ファイルを削除
          rm $CHANGE_LOG

      - name: Invalidate CloudFront Cache
        if: steps.deploy.outputs.INVALIDATION_PATHS != 'NONE'
        run: |
          PATHS="${{ steps.deploy.outputs.INVALIDATION_PATHS }}"
          echo "Invalidating CloudFront cache for paths: $PATHS"
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths $PATHS
