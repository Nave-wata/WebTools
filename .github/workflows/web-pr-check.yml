name: Web PR Build Check and Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'web/**'

jobs:
  build-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nave-wata/webtools/web:latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        working-directory: ./web
        run: npm install

      - name: Build Tailwind CSS
        working-directory: ./web
        run: npx tailwindcss -i ./input.css -o ./assets/tailwind.css --minify

      - name: Build Dioxus application
        id: build-dioxus
        working-directory: ./web
        run: chmod +x ./bundle.sh

      - name: Approve PR
        if: steps.build-dioxus.outputs.build_success == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'ビルドが正常に完了しました。このPRは自動承認されます。'
            });
