name: Web PR Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'web/**'

jobs:
  web-build-check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nave-wata/webtools/web:latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        working-directory: ./web
        run: npm install

      - name: Build Tailwind CSS
        working-directory: ./web
        run: npx tailwindcss -i ./input.css -o ./assets/tailwind.css --minify

      - name: Build Dioxus application
        id: build-dioxus
        working-directory: ./web
        continue-on-error: true
        run: |
          chmod +x ./bundle.sh
          echo "ビルド開始..."
          # ビルド出力をログファイルに保存しつつ、コンソールにも表示
          ./bundle.sh 2>&1 | tee build_output.log
          BUILD_RESULT=${PIPESTATUS[0]}

          # ビルド結果に基づいて出力を設定
          if [ $BUILD_RESULT -eq 0 ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "\n✅ ビルドが正常に完了しました"
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "\n❌ ビルドに失敗しました。上記のログを確認してください。"
          fi

          # 結果を明示的に出力
          echo "BUILD_RESULT=$BUILD_RESULT"

          # エラーを返さずに次のステップへ進む
          exit 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ./web/build_output.log
          retention-days: 7

      - name: Report Success
        if: success() && steps.build-dioxus.outputs.build_success == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ ビルドチェックに成功しました！このPRはビルドテストに合格しています。'
            });

      - name: Report Failure
        if: failure() || steps.build-dioxus.outputs.build_success == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const runId = context.runId;
            const buildLogsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            try {
              // PRにレビューを追加
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'REQUEST_CHANGES',
                body: `❌ ビルドに失敗しました。エラーを修正してください。詳細なビルドログは[アクション実行結果](${buildLogsUrl})でご確認ください。`
              });
            } catch (error) {
              console.log(`PRレビュー作成中にエラーが発生しました: ${error.message}`);
            
              // REQUEST_CHANGES が失敗した場合は PR にコメントを追加（どちらにしろマージはできないので問題はない）
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `❌ ビルドに失敗しました。エラーを修正してください。詳細なビルドログは[アクション実行結果](${buildLogsUrl})でご確認ください。`
              });
            }
